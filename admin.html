<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Branded Outlet by Fatima</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" class="login"><div class="panel"><img src="assets/logo.png"><h1>Admin Panel</h1><p>Manage brands, products, prices, stock and images.</p><form id="loginForm"><input name="username" placeholder="Username" value="admin" required><input name="password" type="password" placeholder="Password" required><button>LOGIN</button></form><small>Default login: <b>admin</b> / <b>ChangeMe123!</b>. For a live site, set ADMIN_USER and ADMIN_PASSWORD in your hosting environment.</small></div></div>
<div id="app" hidden><header><div><b>Branded Outlet by Fatima</b><span> / Admin</span></div><div><a href="/" target="_blank">View Store</a><button id="logout">Logout</button></div></header><main><section class="stats"><div><b id="productCount">0</b><span>Products</span></div><div><b id="brandCount">0</b><span>Brands</span></div><div><b id="orderCount">0</b><span>Orders</span></div></section><section class="layout"><div class="panel"><div class="panel-head"><h2 id="formTitle">Add Product</h2><button id="cancelEdit" hidden>Cancel Edit</button></div><form id="productForm" enctype="multipart/form-data"><input type="hidden" name="id"><label>Brand<input name="brand" list="brands" placeholder="Sapphire" required><datalist id="brands"><option>Sapphire</option><option>Alkaram</option><option>Khaadi</option><option>Nishat Linen</option><option>Bonanza Satrangi</option><option>Ethnic</option><option>Sana Safinaz</option><option>Limelight</option><option>Gul Ahmed</option></datalist></label><label>Product name<input name="name" placeholder="3 Piece Printed Lawn Suit" required></label><label>Product code<input name="code" placeholder="ABC-123"></label><label>Category<select name="category"><option>1 Piece</option><option>2 Piece</option><option>3 Piece</option><option>Unstitched</option><option>Ready to Wear</option></select></label><div class="two"><label>Original price<input name="original" type="number" min="0"></label><label>Sale price<input name="sale" type="number" min="0"></label></div><div class="two"><label>Stock<input name="stock" type="number" min="0" value="10"></label><label>Badge<input name="badge" value="NEW"></label></div><label>Product image<input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/avif"></label><button class="primary" id="saveBtn">ADD PRODUCT</button></form></div>
<div class="panel"><div class="panel-head"><h2>Products</h2><input id="filter" placeholder="Search products..."></div><div id="products"></div></div></section><section class="panel"><div class="panel-head"><h2>Orders</h2><button id="refreshOrders">Refresh</button></div><div id="orders"></div></section></main></div><script src="admin.js"></script></body></html>
